  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs>
      <!-- Sombra suave de una hoja de papel sobre otra -->
      <filter id="sombra-papel" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#5a4128" flood-opacity=".35"/>
      </filter>
      <filter id="sombra-suave" x="-20%" y="-30%" width="140%" height="160%">
        <feDropShadow dx="0" dy="-3" stdDeviation="5" flood-color="#5a4128" flood-opacity=".25"/>
      </filter>
      <!-- Sombra interior: el hueco parece recortado en el papel -->
      <filter id="sombra-interior" x="-10%" y="-10%" width="120%" height="120%">
        <feComponentTransfer in="SourceAlpha" result="inverso"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
        <feGaussianBlur in="inverso" stdDeviation="3.5"/>
        <feOffset dx="0" dy="3.5" result="desplazada"/>
        <feFlood flood-color="#4a3420" flood-opacity=".55"/>
        <feComposite in2="desplazada" operator="in"/>
        <feComposite in2="SourceAlpha" operator="in" result="sombra"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sombra"/></feMerge>
      </filter>
      <!-- Pasa cualquier logo a azul tinta, conservando su forma -->
      <filter id="tinta" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 0.141  0 0 0 0 0.196  0 0 0 0 0.290  0 0 0 1 0"/>
