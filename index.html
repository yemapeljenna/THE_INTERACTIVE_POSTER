<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21 de diciembre · Que en cada casa haya un regalo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="CSS/style.css">

  <!-- Three.js (versión fija r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Filtro para los logos -->
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <defs>
      <!-- Pasa cualquier logo a azul tinta, conservando su forma -->
      <filter id="tinta" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 0.141  0 0 0 0 0.196  0 0 0 0 0.290  0 0 0 1 0"/>
      </filter>
    </defs>
  </svg>

  <!-- ===== CARTEL (848 × 1200, se escala con rem; en impresión ocupa un A3) ===== -->
  <main class="cartel" id="cartel">

    <!-- ===== TEXTOS ===== -->
    <p class="presentan">Associació Educativa Ítaca y PlanetaFP presentan</p>
    <h1 class="titulo">21 de diciembre</h1>
    <p class="eslogan">Que en cada casa haya un regalo</p>

    <!-- ===== ESTRELLITAS DEL FONDO (main.js las dibuja) ===== -->
    <svg class="estrellas" id="estrellas" viewBox="0 0 848 1200" aria-hidden="true" shape-rendering="crispEdges"></svg>

    <!-- ===== SUELO DE NIEVE: borde en bloques, sombras azuladas, montoncitos y caminito (main.js) ===== -->
    <svg class="suelo" id="suelo" viewBox="0 0 848 1200" aria-hidden="true" shape-rendering="crispEdges"></svg>

    <!-- ===== ESCENA 3D (Three.js): casa, muñequitos, regalos, nieve, manga… ===== -->
    <canvas class="escena" id="escena" aria-label="Casita de jengibre de cubitos con cuatro ventanas"></canvas>

    <!-- ===== ESTADO FINAL ===== -->
    <p class="final" id="final">Hay niños que no tienen regalos esta Navidad <span>Con tu ayuda, sí</span></p>

    <!-- ===== PIE (HTML encima del canvas, para que se imprima nítido) ===== -->
    <footer class="pie">

      <!-- Cartelito de galleta clavado en la nieve, con los dos logos -->
      <div class="cartelito">
        <div class="cartelito__canto">
          <div class="cartelito__tabla">
            <div class="cartelito__logo"><img src="IMG/Logo_Aeitaca.webp" alt="Associació Educativa Ítaca"></div>
            <div class="cartelito__logo"><img src="IMG/Logo_PlanetaFP.webp" alt="PlanetaFP"></div>
          </div>
          <div class="guirnalda" data-arriba="si" aria-hidden="true"></div>
        </div>
        <div class="cartelito__palito" aria-hidden="true"></div>
        <p class="cartelito__creditos">
          <span>Associació Educativa Ítaca · L'Hospitalet</span>
          <span><small>con la colaboración de</small> PlanetaFP</span>
        </p>
      </div>

      <!-- Etiqueta de regalo colgada de una cinta, con el QR -->
      <div class="etiqueta">
        <div class="etiqueta__palito" aria-hidden="true"></div>
        <svg class="etiqueta__lazo" viewBox="0 0 22 16" aria-hidden="true" shape-rendering="crispEdges">
          <!-- lazo vóxel morado -->
          <rect x="1" y="1" width="4" height="2" fill="#7b4fa0"/><rect x="0" y="3" width="2" height="3" fill="#7b4fa0"/>
          <rect x="2" y="3" width="3" height="3" fill="#5e3a7c"/><rect x="1" y="6" width="5" height="2" fill="#7b4fa0"/>
          <rect x="17" y="1" width="4" height="2" fill="#7b4fa0"/><rect x="20" y="3" width="2" height="3" fill="#7b4fa0"/>
          <rect x="17" y="3" width="3" height="3" fill="#5e3a7c"/><rect x="16" y="6" width="5" height="2" fill="#7b4fa0"/>
          <rect x="5" y="3" width="12" height="4" fill="#7b4fa0"/><rect x="9" y="2" width="4" height="6" fill="#8f63b5"/>
          <rect x="6" y="8" width="3" height="5" fill="#7b4fa0"/><rect x="5" y="12" width="2" height="2" fill="#7b4fa0"/>
          <rect x="13" y="8" width="3" height="5" fill="#7b4fa0"/><rect x="15" y="12" width="2" height="2" fill="#7b4fa0"/>
          <!-- cinta que baja hasta la etiqueta -->
          <rect x="10" y="8" width="2" height="8" fill="#7b4fa0"/>
        </svg>
        <div class="etiqueta__cuerpo">
          <div class="etiqueta__tarjeta">
            <span class="etiqueta__agujero" aria-hidden="true"></span>
            <img class="etiqueta__qr" src="IMG/qr.svg" alt="Código QR para colaborar con la campaña">
            <p class="etiqueta__texto">Escanéame y ayúdanos a llenarlas</p>
          </div>
          <div class="guirnalda" data-arriba="no" aria-hidden="true"></div>
        </div>
      </div>

    </footer>

    <!-- ===== CURSOR: manga pastelera en pixel art (main.js la dibuja; la boquilla es la punta) ===== -->
    <div class="manga" id="manga" aria-hidden="true"></div>

  </main>

  <script src="JS/main.js" defer></script>
</body>
</html>
